<!DOCTYPE html>
<html>
  <head>

    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />

    <title>Visitor Parking Availability for UW-Madison</title>

    <style>
        html,
        body,
        #viewDiv {
         padding: 0;
         margin: 0;
         height: 100vh;
         width: 100vw;
         overflow: hidden;
        }
       </style>

    <link rel="stylesheet" href="https://js.arcgis.com/4.26/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.26/"></script>

    <script>
        require([ 
            "esri/config",
            "esri/Map", 
            "esri/views/MapView",
            "esri/widgets/Locate",
            "esri/layers/FeatureLayer"], 
            (esriConfig, Map, MapView, Locate, FeatureLayer) => {

                esriConfig.apiKey = "AAPTanQncLZrZf5ur6pM-ljzNxg..i-VpfICarg1tjz10faxck-Zge3EjZ7zUUP6cbX081l71ELCp9bpgqiXurYSbhs0fDmOXMQXAyGeiHz6r66t7EHfdRLO-CHh0jjakX3bxMaWeDs_FW1ECWOu3cH9p_uFnmikXqwfxpBtMbKtKduCMoKi4NsJLd979B2jQuh6qA8C7XL6pc-Zsj47-Mbr-jDGLgR_QEzkw_Qgpi8Q4oJ-Tc-g8-3Y2Q9sE_mfixuiuCYkRfvXy_LtaeqpybeLD6TZomJ_jjRIL7QE.AT1_ZP956a50";
                
                const map = new Map({
                    basemap: "streets-vector" // Basemap layer service
                });

                const view = new MapView({
                    container: "viewDiv", // Reference to the DOM node that will contain the view
                    map: map, // References the map object
                    center: [-89.4073, 43.0723], // Longitude, latitude format
                    zoom: 13, // Zoom scale level
                });

                const locateBtn = new Locate({
                    view: view
                });

                const parkingRenderer = {
                    type: "simple",
                    symbol: {
                        type: "picture-marker",
                        url: "https://BLDBG.github.io/parkingmap/parking_sign.png",
                        width: 24,
                        height: 24,
                        outline: {
                            color: [0, 0, 0],
                            width: 1
                        }
                }};


                const parkingLayer = new FeatureLayer({ 
                    // URL to the service 
                    url: "https://services.arcgis.com/HRPe58bUyBqyyiCt/arcgis/rest/services/survey123_21ca45db92d94905b59b6ed36aa73194_results/FeatureServer",
                    renderer: parkingRenderer
                });

                // Add the feature layer to the map
                map.add(parkingLayer);

                // Add the locate widget to the top left corner of the view
                view.ui.add(locateBtn, {
                    position: "bottom-left"
                });

         });
        
    </script>

  </head>

  <body>

    <div id="viewDiv"></div>

  </body>
</html>
